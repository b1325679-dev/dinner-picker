<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚餐「心情與口袋」決定器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slotSpin {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { transform: translateY(10%); opacity: 0.8; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .spin-anim {
            animation: slotSpin 0.4s ease-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-100 via-orange-100 to-rose-200 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/80 backdrop-blur-md shadow-2xl rounded-3xl p-6 md:p-8 max-w-md w-full border border-white/50">
        <!-- 標題區 -->
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-extrabold text-orange-600 tracking-wide">🍱 晚餐決定器</h1>
            <p class="text-xs md:text-sm text-gray-500 mt-1">擺脫選擇困難症，讓 AI 幫你秒選晚餐！</p>
        </div>

        <!-- 輸入表單區 -->
        <div class="space-y-5">
            <!-- 1. 心情指數 -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-sm font-bold text-gray-700">今日心情指數</label>
                    <span id="moodEmoji" class="text-2xl">😭</span>
                </div>
                <input type="range" id="moodInput" min="1" max="10" value="3" 
                       class="w-full h-2 bg-orange-200 rounded-lg appearance-none cursor-pointer accent-orange-500"
                       oninput="updateMoodUI()">
                <div class="flex justify-between text-xs text-gray-400 mt-1">
                    <span>1 (極度心累)</span>
                    <span>5 (平淡如水)</span>
                    <span>10 (爽翻天)</span>
                </div>
            </div>

            <!-- 2. 晚餐預算 -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">晚餐預算 (NTD)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 font-bold">$</span>
                    <input type="number" id="budgetInput" value="150" min="30" max="1000"
                           class="w-full pl-8 pr-4 py-2 bg-orange-50/50 border border-orange-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-400 text-gray-800 font-semibold">
                </div>
            </div>

            <!-- 3. 步行時間 -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-sm font-bold text-gray-700">願意走路時間</label>
                    <span id="walkVal" class="text-sm font-bold text-orange-600">5 分鐘</span>
                </div>
                <input type="range" id="walkInput" min="1" max="30" value="5" 
                       class="w-full h-2 bg-orange-200 rounded-lg appearance-none cursor-pointer accent-orange-500"
                       oninput="document.getElementById('walkVal').innerText = this.value + ' 分鐘'">
                <p class="text-[10px] text-gray-400 mt-1">* 距離推算依據成人平均步速 (約 4.8 km/h) 計算</p>
            </div>

            <!-- 決策按鈕 -->
            <button onclick="decideDinner()" id="decideBtn"
                    class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold rounded-2xl shadow-lg hover:shadow-orange-300 transition-all duration-200 active:scale-95">
                🎰 幫我決定晚餐！
            </button>
        </div>

        <!-- 結果展示卡片 -->
        <div id="resultCard" class="hidden mt-6 p-5 bg-gradient-to-r from-orange-50 to-amber-50 border border-orange-200 rounded-2xl text-center space-y-3 relative overflow-hidden">
            <span class="text-xs font-semibold uppercase tracking-wider text-orange-500 bg-orange-100 px-3 py-1 rounded-full">AI 決定結果</span>
            
            <div id="foodResult" class="text-2xl font-black text-gray-800 tracking-wide mt-2">
                【麻辣鴨血】
            </div>

            <div class="flex justify-center items-center gap-4 text-sm font-medium text-gray-600 mt-2">
                <div>情緒療癒：<span id="healVal" class="font-bold text-rose-500">80%</span></div>
                <div>合理距離：<span id="distVal" class="font-bold text-amber-600">約 400 公尺內</span></div>
            </div>

            <div id="aiQuote" class="text-sm text-gray-600 bg-white/60 p-3 rounded-xl border border-orange-100 mt-2">
                預估花費：$150 <br>
                <span class="text-xs italic text-gray-500 mt-1 block">「吃飽飽才有力氣繼續努力喔！」</span>
            </div>
            
            <!-- 動態 Google Maps 連結按鈕 -->
            <a id="mapsLink" href="#" target="_blank" 
               class="mt-3 block w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold rounded-xl shadow-md transition-all">
                📍 在 Google 地圖尋找附近店家
            </a>

            <button onclick="decideDinner()" class="text-xs font-bold text-orange-600 hover:underline mt-3">
                🔄 不滿意？再抽一次
            </button>
        </div>
    </div>

    <script>
        const WALKING_SPEED_M_PER_MIN = 80;

        const foods = {
            lowMood: [
                { name: "麻辣鴨血臭豆腐", keyword: "麻辣鴨血", price: 85, quote: "沒什麼是一碗熱辣豆腐解決不了的，有的話就兩碗！" },
                { name: "濃郁日式拉麵", keyword: "拉麵", price: 220, quote: "一口濃郁熱湯，直接拯救你崩潰的心情～" },
                { name: "韓式炸雞加奶茶", keyword: "韓式炸雞", price: 180, quote: "熱量即是正義！今天先不要管減肥了啦！" },
                { name: "熱呼呼鹹酥雞", keyword: "鹹酥雞", price: 120, quote: "蒜香炸雞塊，吃一口幸福感爆棚！" }
            ],
            midMood: [
                { name: "排骨飯加滷蛋", keyword: "排骨飯", price: 110, quote: "經典不敗款，最實在的大學生好夥伴！" },
                { name: "牛肉麵加酸菜", keyword: "牛肉麵", price: 150, quote: "吃飽喝足，又是平淡美好的一天～" },
                { name: "水餃加酸辣湯", keyword: "水餃", price: 90, quote: "一口水餃一口湯，簡單快意的美味。" },
                { name: "火腿蛋炒飯", keyword: "炒飯", price: 80, quote: "鑊氣十足的炒飯，撫平午後的微小疲憊。" }
            ],
            highMood: [
                { name: "炙燒牛排套餐", keyword: "牛排", price: 350, quote: "心情這麼好，當然要吃塊大牛排慶祝一下！" },
                { name: "日式生魚片丼飯", keyword: "生魚片丼飯", price: 280, quote: "享受精緻美味，犒賞今天超棒的自己！" },
                { name: "韓式燒肉", keyword: "韓式燒肉", price: 599, quote: "叫上好朋友，今晚開心地大口吃肉吧！" },
                { name: "精緻義大利麵", keyword: "義大利麵", price: 250, quote: "燈光美氣氛佳，享受高品質的美味晚餐！" }
            ]
        };

        const emojis = ["😭", "🥺", "😩", "😕", "😐", "🙂", "😃", "😊", "🥳", "🤩"];

        function updateMoodUI() {
            const val = document.getElementById('moodInput').value;
            document.getElementById('moodEmoji').innerText = emojis[val - 1];
        }

        function decideDinner() {
            const mood = parseInt(document.getElementById('moodInput').value);
            const budget = parseInt(document.getElementById('budgetInput').value);
            const walkMin = parseInt(document.getElementById('walkInput').value);
            const btn = document.getElementById('decideBtn');
            const resultCard = document.getElementById('resultCard');

            if (isNaN(budget) || budget <= 0) {
                alert("溫馨提醒：請輸入正確的預算喔！");
                return;
            }

            btn.disabled = true;
            btn.innerText = "🎲 運算真實條件中...";
            resultCard.classList.add('hidden');

            setTimeout(() => {
                let category = 'midMood';
                if (mood <= 4) category = 'lowMood';
                else if (mood >= 8) category = 'highMood';

                let availableFoods = foods[category].filter(food => food.price <= budget);
                let picked;
                if (availableFoods.length === 0) {
                    picked = { name: "便利商店微波便當", keyword: "便利商店", price: Math.min(budget, 65), quote: "預算有點吃緊，但吃飽最重要！" };
                } else {
                    picked = availableFoods[Math.floor(Math.random() * availableFoods.length)];
                }

                const maxDistanceMeters = walkMin * WALKING_SPEED_M_PER_MIN;
                
                let locationPrefix = "";
                if (maxDistanceMeters <= 400) {
                    const close = ["巷口的", "樓下的", "學餐的", "轉角的"];
                    locationPrefix = close[Math.floor(Math.random() * close.length)];
                } else if (maxDistanceMeters <= 1200) {
                    const mid = ["附近商圈的", "學區周邊的", "過馬路那間"];
                    locationPrefix = mid[Math.floor(Math.random() * mid.length)];
                } else {
                    const far = ["隔壁夜市的", "市區排隊名店", "騎車去吃的"];
                    locationPrefix = far[Math.floor(Math.random() * far.length)];
                }

                const healPercent = (11 - mood) * 10;

                // 填入結果
                document.getElementById('foodResult').innerText = `【${locationPrefix}${picked.name}】`;
                document.getElementById('healVal').innerText = healPercent + "%";
                document.getElementById('distVal').innerText = `約 ${maxDistanceMeters} 公尺內`;
                document.getElementById('aiQuote').innerHTML = `預估花費：$${picked.price} <br> <span class="text-xs italic text-gray-500 mt-1 block">「${picked.quote}」</span>`;

                // 動態產生 Google 地圖搜尋連結
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(picked.keyword)}`;
                document.getElementById('mapsLink').href = mapsUrl;

                resultCard.classList.remove('hidden');
                resultCard.classList.add('spin-anim');
                btn.disabled = false;
                btn.innerText = "🎰 幫我決定晚餐！";
            }, 800);
        }
    </script>
</body>
</html>
