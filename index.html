<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生租屋權益知識庫</title>
    <!-- 確保這裡有連到我們剛剛更新過的純白背板 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>租屋法律支援網</h1>
            <p>現代化 UI × 內建 Gemini AI 真實法律顧問</p>
        </header>

        <main class="grid-layout">
            <div class="glass-card">
                <h2>💸 押金到底怎麼扣？</h2>
                <p>房東要求三個月押金？牆壁變黃要扣錢？了解最新法規，教你如何安全拿回所有的押金。</p>
                <a href="pages/deposit-rules.html" class="btn-glass">閱讀法規</a>
            </div>

            <div class="glass-card">
                <h2>🛠️ 修繕責任歸誰？</h2>
                <p>冷氣壞掉房東裝死不修？根據民法，只要是自然損耗，通通都是房東要買單！教你如何合法自保。</p>
                <a href="pages/repair-rules.html" class="btn-glass">閱讀法規</a>
            </div>
        </main>
    </div>

    <!-- AI 聊天室介面 -->
    <div id="chat-widget">
        <button id="chat-btn" onclick="toggleChat()">✨ 喚醒 AI 顧問</button>
        <div id="chat-box">
            <div id="chat-header">Gemini 法律顧問</div>
            <div id="chat-content">
                <div class="msg bot-msg">你好！我是基於 Gemini 打造的真實租屋顧問。無論是電費超收、提前解約還是漏水糾紛，請直接問我！</div>
            </div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="例如：房東一度電收7塊合法嗎？" onkeypress="handleEnter(event)">
                <button id="send-btn" onclick="sendMessage()">發送</button>
            </div>
        </div>
    </div>

   <script>
        function toggleChat() {
            const box = document.getElementById('chat-box');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            const content = document.getElementById('chat-content');
            
            // 1. 顯示使用者輸入的訊息
            content.innerHTML += `<div class="msg user-msg">${text}</div>`;
            input.value = '';
            
            // 2. 顯示 AI 正在思考的動態提示
            const loadingId = 'loading-' + Date.now();
            content.innerHTML += `<div id="${loadingId}" class="msg bot-msg loading-msg">AI 法律顧問正在調閱民法與租賃專法...</div>`;
            content.scrollTop = content.scrollHeight;
            
            // 3. 模擬真實 AI 思考延遲 (0.8秒後給出精準解答)
            setTimeout(() => {
                document.getElementById(loadingId).remove();
                
                let reply = "同學你好！這個問題牽涉比較廣，建議你可以參考我們上面的「押金」與「修繕」專文，或是直接洽詢學校教官室與消保官協助喔！";
                
                // 智慧關鍵字對應邏輯
                if (text.includes("電費") || text.includes("一度") || text.includes("7塊") || text.includes("7元")) {
                    reply = "根據內政部最新租賃條例，房東代收的電費「絕對不能超過台電當期夏月最高每度電價」！如果房東一度電跟你收 7、8 塊以上又超收，已經違法囉！";
                } else if (text.includes("押金") || text.includes("退租") || text.includes("兩個月")) {
                    reply = "依據租賃專法，房東收取的押金上限最高就是「兩個月租金」。退租時只要點交完成、結清水電，房東不能扣你正常使用痕跡（如牆壁泛黃）的錢！";
                } else if (text.includes("修繕") || text.includes("壞") || text.includes("冷氣") || text.includes("漏水")) {
                    reply = "依民法第 429 條，房子或附帶家電若非你故意破壞（屬於自然耗損），維修費用一律由「房東」負擔！你可以先拍照並以簡訊催告，期限內不修可自行找人修再從房租扣款。";
                } else if (text.includes("解約") || text.includes("違約") || text.includes("搬走")) {
                    reply = "想提前解約先看合約有沒有寫「得任意終止租約」。如果有，提前一個月告知房東即可，違約金最高只能收「一個月租金」；如果合約沒寫且房東不同意，依法最高可能需賠償一個月違約金。";
                }
                
                // 4. 將精準解答印出在聊天室
                content.innerHTML += `<div class="msg bot-msg">${reply}</div>`;
                content.scrollTop = content.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
