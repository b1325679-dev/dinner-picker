<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生租屋權益知識庫</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>租屋法律支援網</h1>
            <p>Glassmorphism 現代 UI × 內建 Gemini AI 真實法律顧問</p>
        </header>

        <main class="grid-layout">
            <div class="glass-card">
                <h2>💸 押金到底怎麼扣？</h2>
                <p>房東要求三個月押金？牆壁變黃要扣錢？了解最新法規，教你如何安全拿回所有的押金。</p>
                <a href="pages/deposit-rules.html" class="btn-glass">閱讀法規</a>
            </div>

            <div class="glass-card">
                <h2>🛠️ 修繕責任歸誰？</h2>
                <p>冷氣壞掉房東裝死不修？根據民法，只要是自然損耗，通通都是房東要買單！教你如何合法自保。</p>
                <a href="pages/repair-rules.html" class="btn-glass">閱讀法規</a>
            </div>
        </main>
    </div>

    <!-- AI 聊天室 -->
    <div id="chat-widget">
        <button id="chat-btn" onclick="toggleChat()">✨ 喚醒 AI 顧問</button>
        <div id="chat-box">
            <div id="chat-header">Gemini 法律顧問</div>
            <div id="chat-content">
                <div class="msg bot-msg">你好！我是基於 Gemini 打造的真實租屋顧問。無論是電費超收、提前解約還是漏水糾紛，請直接問我！</div>
            </div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="例如：房東一度電收7塊合法嗎？" onkeypress="handleEnter(event)">
                <button id="send-btn" onclick="sendMessage()">發送</button>
            </div>
        </div>
    </div>

    <script>
        // 【重要】將你申請的 Gemini API Key 貼在下方單引號內
        const API_KEY = 'AQ.Ab8RN6Ius1z3xVL59LfbVJNsNVswslJ2w87IMC-H-0Z11Z-ghg'; 

        function toggleChat() {
            const box = document.getElementById('chat-box');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            const content = document.getElementById('chat-content');
            
            // 1. 顯示使用者輸入
            content.innerHTML += `<div class="msg user-msg">${text}</div>`;
            input.value = '';
            
            // 2. 顯示思考中
            const loadingId = 'loading-' + Date.now();
            content.innerHTML += `<div id="${loadingId}" class="loading-msg">Gemini 正在分析法規...</div>`;
            content.scrollTop = content.scrollHeight;
            
            // 3. 呼叫真實的 Gemini API
            try {
                // 設定 Prompt：限制他用純文字、白話文回答租屋問題
                const promptText = `你是一個專業的台灣大學生租屋法律顧問。請用純文字（不要使用 Markdown 星號或粗體）、白話、親切且簡短（100字內）的方式回答以下問題：\n問題：${text}`;
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });
                
                const data = await response.json();
                
                // 移除思考中文字
                document.getElementById(loadingId).remove();
                
                // 4. 顯示 AI 真正生成的回覆
                if (data.candidates && data.candidates.length > 0) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    content.innerHTML += `<div class="msg bot-msg">${aiReply}</div>`;
                } else {
                    content.innerHTML += `<div class="msg bot-msg">抱歉，API連線發生錯誤。</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                content.innerHTML += `<div class="msg bot-msg">連線失敗，請檢查 API Key 是否正確填寫。</div>`;
            }
            content.scrollTop = content.scrollHeight;
        }
    </script>
</body>
</html>
