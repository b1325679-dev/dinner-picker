    <title>押金規則與退還 - 學生租屋知識庫</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <a href="../index.html">← 返回首頁</a>
        
        <div class="card">
            <h2>押金上限：最多只能收兩個月</h2>
            <p>依照現行法規，房東向學生收取的押金，最高「絕對不能超過兩個月的租金總額」。如果房東要求收三個月，那是違法的，你可以勇敢拒絕，或者將超過的部分要求抵扣未來的房租。</p>
        </div>

        <div class="card">
            <h2>退租時，押金什麼時候該還？</h2>
            <p>只要你在退租時完成以下兩件事，房東就應該把押金全額退還給你：</p>
            <ul>
                <li>把房間清空，並把鑰匙交還給房東（完成點交）。</li>
                <li>結清你這段期間應該付的水電費或瓦斯費。</li>
            </ul>
        </div>
    </div>
</body>
