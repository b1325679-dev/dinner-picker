<body>
    <div class="container">
        <a href="../index.html" class="back-link">← 返回首頁</a>
        
        <div class="card">
            <h2>💰 押金上限：最多只能收兩個月</h2>
            <p>依照現行法規，房東向學生收取的押金，最高「絕對不能超過兩個月的租金總額」。如果房東要求收三個月，那是違法的，你可以勇敢拒絕，或者將超過的部分要求抵扣未來的房租。</p>
        </div>

        <div class="card blue-tape" style="margin-top: 30px;">
            <h2>🧐 如果房東亂扣押金怎麼辦？</h2>
            <p>很多房東會以「自然使用痕跡」（例如牆壁稍微變黃、沙發正常老舊）為理由扣押金，這是不合理的。只有在你「惡意破壞」或「未盡到善良管理人責任」（比如把門踢破、冷氣砸壞）時，房東才有權要求賠償。</p>
            <p><strong>💡 強烈建議</strong>：看屋跟退租時，一定要「拍照錄影存證」，保障自己的錢包！</p>
        </div>
    </div>
